<section class="screen" id="screen-create" aria-hidden="true">

</section>
<section class="screen panel" id="screen-garden" aria-hidden="true">

<div class="grid" id="gGrid"></div>

<button class="big" data-act="back">Kasabaya dön</button>
</section>
<section class="screen panel" id="screen-soon" aria-hidden="true">
<div class="card"><div class="icon" id="soonIcon"></div><h2 id="soonTitle">Alan</h2><p>Bu alan çok yakında açılacak.</p></div>
<button class="big" data-act="back">Kasabaya dön</button>
</section>
<section class="screen panel" id="screen-settings" aria-hidden="true">
<div class="card"><h2>Ayarlar</h2><p class="ver" id="ver"></p></div>
<button class="big alt" id="soundBtn" data-act="sound" aria-pressed="true">Ses açık</button>
<button class="big alt" data-act="editchar">Karakterimi değiştir</button>
<button class="big alt" data-act="log">Hata günlüğü</button>
<button class="big" data-act="back">Kasabaya dön</button>
</section>
<section class="screen panel" id="screen-log" aria-hidden="true">
<div class="card"><h2>Hata günlüğü</h2></div>
<pre class="logbox" id="logBox"></pre>
<button class="big alt" data-act="copylog">Kopyala</button>
<button class="big alt" data-act="clearlog">Temizle</button>
<button class="big" data-act="back">Geri</button>
</section>
