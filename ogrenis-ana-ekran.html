<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ÖĞRENİŞ – Ana Ekran</title>
<style>
:root{--ink:#35506b;--cream:#fff3d6;--sky:#7ccbff;--grass:#6fcf7d;--sun:#ffcf4a;--orange:#ff9b54;--coral:#ff7a6b;--bg:#bfe7ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d2c3f}}
:root[data-theme="dark"]{--bg:#1d2c3f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;overscroll-behavior:none;
font-family:ui-rounded,"Nunito","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;user-select:none;-webkit-user-select:none}
.app{position:fixed;inset:0;max-width:520px;margin:0 auto;overflow:hidden}
svg.world{position:absolute;inset:0;width:100%;height:100%;display:block}
.o{stroke:var(--ink);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.n{stroke:none}
text{font-family:inherit;font-weight:800;fill:var(--ink)}
[data-place]{cursor:pointer;outline:none}
[data-place]:focus-visible .pill{stroke:var(--coral);stroke-width:4}
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.07,.94)}100%{transform:scale(1)}}
g,circle,rect,path{transform-box:fill-box;transform-origin:center bottom}
.bob{animation:bob 2.6s ease-in-out infinite}
.bob2{animation:bob 2.2s ease-in-out .5s infinite}
.bob3{animation:bob 2.8s ease-in-out 1s infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.cloud{animation:drift 70s linear infinite;transform-origin:center}
.cloud2{animation-duration:95s;animation-delay:-40s}
@keyframes drift{from{transform:translateX(-80px)}to{transform:translateX(120px)}}
.puff{animation:puff 3.2s ease-out infinite;transform-origin:center}
.puff2{animation-delay:1.6s}
@keyframes puff{0%{opacity:.9;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(10px,-26px) scale(1.4)}}
.hud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 0;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.pill-ui,.btn{pointer-events:auto;background:var(--cream);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);color:var(--ink);font:inherit;font-weight:900}
.pill-ui{height:48px;border-radius:24px;padding:0 16px 0 10px;display:flex;align-items:center;gap:8px;font-size:20px}
.btn{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;padding:0}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.logo{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 74px);text-align:center;pointer-events:none}
.logo h1{margin:0;font-size:clamp(40px,13vw,60px);line-height:1;font-weight:900;letter-spacing:1px;display:flex;justify-content:center}
.logo h1 span{display:inline-block;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);animation:land .6s cubic-bezier(.3,1.7,.5,1) backwards}
.logo h1 span:nth-child(odd){transform:rotate(-4deg)}.logo h1 span:nth-child(even){transform:rotate(3deg) translateY(2px)}
.logo h1 span:nth-child(1){color:#ff7a6b;animation-delay:.05s}.logo h1 span:nth-child(2){color:#ffcf4a;animation-delay:.12s}
.logo h1 span:nth-child(3){color:#6fcf7d;animation-delay:.19s}.logo h1 span:nth-child(4){color:#5aa9e6;animation-delay:.26s}
.logo h1 span:nth-child(5){color:#ff9b54;animation-delay:.33s}.logo h1 span:nth-child(6){color:#ff7a6b;animation-delay:.40s}
.logo h1 span:nth-child(7){color:#ffcf4a;animation-delay:.47s}
@keyframes land{from{opacity:0;translate:0 -30px}to{opacity:1;translate:0 0}}
.logo p{margin:12px 0 0;font-size:18px;font-weight:900;color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill}
.toast{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--cream);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);border-radius:26px;padding:14px 18px;display:flex;gap:14px;align-items:center;color:var(--ink);transform:translateY(160%);transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.toast.on{transform:none}
.toast i{flex:none;width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:var(--c,#ffcf4a)}
.toast b{display:block;font-size:20px}.toast span{font-size:15px;font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
(function(){
var info={
orman:["Kelime Ormanı","Kaybolan harfleri bulacağız.","#6fcf7d"],
istasyon:["Tren İstasyonu","Treni birlikte yola çıkaracağız.","#5aa9e6"],
firin:["Fırın","Simitleri birlikte hazırlayacağız.","#ff9b54"],
ev:["Evim","Evini ve bahçeni düzenleyeceksin.","#ff8a5b"],
gorev:["Görev panosu","Bugünün küçük görevleri burada.","#ffcf4a"],
ayar:["Ayarlar","Ses ve diğer seçenekler burada olacak.","#fff3d6"]};
var toast=document.getElementById("toast"),timer=null;
function show(key,el){
try{
var d=info[key];if(!d)return;
if(el&&el.classList){el.classList.remove("pop");void el.getBoundingClientRect();el.classList.add("pop");}
document.getElementById("tt").textContent=d[0];
document.getElementById("tx").textContent=d[1];
document.getElementById("ti").style.setProperty("--c",d[2]);
toast.classList.add("on");clearTimeout(timer);
timer=setTimeout(function(){toast.classList.remove("on");},2600);
}catch(e){}}
document.addEventListener("click",function(e){var t=e.target.closest("[data-place]");if(t)show(t.getAttribute("data-place"),t);});
document.addEventListener("keydown",function(e){if(e.key!=="Enter"&&e.key!==" ")return;var t=e.target.closest&&e.target.closest("[data-place]");if(t){e.preventDefault();show(t.getAttribute("data-place"),t);}});
})();
</script>
